<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>UI Color Palette /one・WCAG Color Palette Manager for Apps & Websites</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      #app,
      #modal {
        width: 100%;
      }
    </style>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var embedParam = (params.get('embed') || '').toLowerCase();
        var isEmbed = embedParam === '1' || embedParam === 'true';
        if (isEmbed) document.documentElement.classList.add('is-embed');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal"></div>
    <div id="toast"></div>
    <script
      type="module"
      src="/src/index.tsx"
    ></script>
  </body>
</html>
